title: Spatial Audio Occlusion Demo
lead: >-
  Recreated Like Or Die's occlusion calculation flow on a 3D voxel grid.
  Drag to rotate the view; move the sound source and listener, or place and erase blocks.
  Turn on sound to hear the computed occlusion.

steps:
  - title: Direct Ray
    text: >-
      Checks a straight line between listener and sound source. If unobstructed, occlusion is 0.
  - title: A\* Detour Path
    text: >-
      Only when blocked, runs A\* on the voxel grid to find a path around.
      Moves in 26 directions including up and down; stops searching once accumulated cost reaches the saturation threshold.
  - title: Detour Ratio
    text: >-
      (path length − direct distance) / direct distance. Small when going around a single door or over a low wall, large for maze-like detours.
  - title: Exponential Saturation Curve
    text: >-
      Occlusion factor is an exponential saturation curve of the detour ratio. Converges to 1 as the ratio grows, without linear jumps.
      Nearby sound sources get near-field scaling that applies weaker occlusion.
  - title: Diffraction Virtual Source
    text: >-
      When blocked, keeps sound from passing through walls: follows the detour path from the listener to find the last still-visible corner (door, wall edge).
      Places a virtual source on the extension of the listener-to-corner direction, at the direct distance to the sound source.
      Moves the Wwise game object to this position so sound comes from the doorway. Use the demo's virtual source switch to show that position.

note: >-
  Actual implementation is a UE5 C++ world subsystem; computed values are passed to Wwise as RTPCs.
  Enclosure is computed as in production, casting 3D rays in 26 directions from head position.
  Numbers such as curve slope, saturation threshold and near-field range are set to drive the demo, not actual project values.
  Demo sound is synthesized with Web Audio; mappings from values to volume / low-pass / reverb are also demo-only.
  Why occlusion is computed in-house and how its cost was reduced: see [Like Or Die Sound System](#like-or-die--sound).

