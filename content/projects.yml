# items 하나가 작품 하나입니다. 위에서부터 이 순서대로, 왼쪽 이미지 + 오른쪽 글로 놓입니다.
#   id       주소 뒤에 붙는 이름입니다. 예) index.html#student-works--moon-slasher
#   image    대표 이미지 경로 (images/ 폴더 기준)
#   award    제목 아래 한 줄. 수상 / 출품 이력. [글자](주소) 로 링크를 걸 수 있습니다.
#            [ 로 시작하는 줄은 반드시 ">-" 를 붙이고 다음 줄에 씁니다. (YAML 규칙)
