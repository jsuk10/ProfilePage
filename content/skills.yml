# 업무 숙련도
#
# rows 하나가 표의 한 줄입니다.
#   area      왼쪽 '영역' 칸
#   summary   '숙련 내용' 칸 첫 줄. 한 문장으로 짧게 씁니다.
#   detail    '숙련 내용' 칸 둘째 줄. 쓴 기술과 한 일을 자세히 적습니다.
#   projects  오른쪽 '근거 경력' 칸 버튼입니다.
#     name  버튼 글자
#     ref   누르면 이동할 경력 상세 항목입니다. "섹션 id#항목 id" 형식이고,
#           항목 id 는 career/*.md 의 "## 제목 {#항목-id}" 에서 정합니다.
#           ref 를 비우면 이동 없이 이름만 보입니다.

title: 업무 숙련도
lead: |-
  출시 전 개발부터 라이브 서비스까지, {total} 동안 쌓은 영역별 숙련도

  오른쪽 버튼으로 해당 경력 상세로 바로 이동

rows:
  - area: 엔진 / 에디터
    summary: 엔진 소스까지 내려가 원인 추적, 필요한 에디터 툴 직접 제작
    detail: >-
      Unreal Engine 4.27 → 5 ({total}). Slate 윈도우 / 뷰포트 툴, 에디터 서브시스템,
      플러그인(Mutable / Niagara) 내부 수정, 엔진 소스 레벨 원인 추적과 수정
    projects:
      - name: NC
        ref: like-or-die#load-performance
      - name: 넥슨
        ref: prasia#editor-tooling

  - area: 퍼포먼스 / 프로파일링
    summary: 측정으로 병목 파악·수정 후 같은 조건 재측정으로 확인
    detail: >-
      Unreal Insights 전후 1:1 비교, 측정 재현성 확보(GC 시점 고정, 대조군),
      비동기 프리로드 / 컴포넌트 풀링 설계, 모바일 PSO 캐시, Animation Budget Allocator 튜닝
    projects:
      - name: NC
        ref: like-or-die#load-performance
      - name: 넥슨
        ref: prasia#performance

  - area: 사운드 (Wwise)
    summary: Wwise 재생 구조·공간음향 실시간 계산 직접 설계
    detail: >-
      재생 서브시스템 + 오디오 컴포넌트 풀링, 차폐 / 밀폐도 실시간 계산(멀티스레드), 우회 경로 쪽 가상 음원,
      Motion, 로컬라이제이션, WAAPI 오프라인 렌더 도구, 라이브 유지보수(미재생 / Starvation 분석)
    projects:
      - name: NC
        ref: like-or-die#sound
      - name: 넥슨
        ref: prasia#audio-plugins

  - area: 네트워크 / 리플레이
    summary: 엔진 리플레이 위에 녹화, 구간 재생, 관전 기능 구현
    detail: >-
      DemoNetDriver 녹화 / 재생, 구간 절단, Seek 후 상태 복원, 리플레이 전용 복제 조건, 관전 대상 추적
    projects:
      - name: NC
        ref: like-or-die#replay

  - area: 빌드 / CI / SCM
    summary: 빌드 실패 시 고칠 사람에게 바로 가는 알림 구축
    detail: >-
      Jenkins / TeamCity 스텝 설계, 스트림별 교차 빌드, 심볼 백업 자동화,
      실패 리비전 작업자 멘션, Perforce 운영 지원
    projects:
      - name: 넥슨
        ref: prasia#ci-cd
      - name: NC
        ref: like-or-die#build-alert

  - area: 플랫폼 / 플러그인 운영
    summary: 크래시 수집 도구 도입부터 운영까지 담당, 플랫폼 이슈 대응
    detail: >-
      Backtrace 도입과 운영(심볼 태깅, ANR / OOM 지표, SDK 소스 분석으로 네이티브 에러 핸들링),
      Vivox, iOS 프로비저닝 / 스토어 정책, Android OOM 사후 관리, 게임패드 진동
    projects:
      - name: 넥슨
        ref: prasia#backtrace
      - name: NC
        ref: like-or-die#etc

  - area: 자동화 / ML
    summary: 반복 작업 툴화, 에디터에 ML 모델 연동
    detail: >-
      Python 유틸과 간이 런처, Power Automate → Teams 알림,
      PyTorch → ONNX → UE NNE 에디터 인퍼런스 파이프라인
    projects:
      - name: 넥슨
        ref: prasia#ci-cd
      - name: NC
        ref: like-or-die#ml-notify
