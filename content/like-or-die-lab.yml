# Like Or Die 툴 데모 (type: lab). 적는 법은 prasia-lab.yml 맨 위 주석과 같습니다.
#   notify  Slate 백그라운드 알림. app(게임 이름), window(게임 창 그림), editor(앞에 있는 다른 창 이름), banner(알림 그림), banner_alt(그림 설명),
#           events 는 버튼 목록. always: true 인 이벤트는 게임이 앞에 있어도 알림을 띄웁니다.

title: Like Or Die 툴 데모
lead: >-
  Like Or Die 에서 만든 Slate 백그라운드 알림을 데모로 옮겼습니다. 공간음향 차폐 계산은 위 [Spatial Audio](#spatial-audio) 섹션에 따로 있습니다.

demos:
  - kind: notify
    title: Slate 백그라운드 알림
    text: >-
      게임이 뒤에 있을 때 매칭·로딩 완료 같은 이벤트를 포커스를 뺏지 않는 topmost Slate 창으로 알리고, 알림을 누르면 게임 창을 앞으로 가져옵니다.
      게임이 이미 앞에 있으면 띄우지 않고, 라이브 코딩이 끝난 알림은 에디터가 앞에 있어도 띄웁니다. 알림 그림은 레퍼런스로 삼은 아크 레이더스 대기창 알림입니다.
    app: Like Or Die
    window: images/likeordie.webp
    editor: Unreal Editor
    banner: images/work/arc-raiders-notification.png
    banner_alt: 레퍼런스로 삼은 아크 레이더스의 대기창 알림. "정신 바짝 차리세요, 레이더님. 지상으로 가는 중입니다." 라고 적혀 있습니다. 누르면 게임 창이 앞으로 옵니다.
    events:
      - label: 매칭 완료
      - label: 로딩 완료
      - label: 라이브 코딩 끝
        always: true
