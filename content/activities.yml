      - text: 인프런 애플 웹사이트 인터랙션 클론
        date: 2020.11 ~ 2020.12
      - text: >-
          [GitHub Game Off 2020](https://itch.io/jam/game-off-2020/rate/837025) (Moon Slasher)
        date: 2020.11
        highlight: 게임
      - text: >-
          [노마드 코더](https://nomadcoders.co/) Vanilla JS & Challenge
