# 학생 시절 활동
#
# groups 하나가 칸 하나입니다. (아이콘 + 제목 + 목록)
#   icon    Font Awesome 5 아이콘 이름 (fa- 뒤 부분). 예) trophy, graduation-cap, book-open, users
#           목록: https://fontawesome.com/v5/search?o=r&m=free&s=solid
#   items   text 와 date 를 적습니다. text 에는 [글자](주소) 로 링크를 걸 수 있습니다.
#           [ 로 시작하는 text 는 ">-" 를 붙이고 다음 줄에 씁니다. (YAML 규칙)
#   highlight  적으면 그 항목 글자를 굵게 하고 옆에 그 글자로 표시를 붙입니다. 예) highlight: 게임

title: 학생 시절 활동
lead: >-
  학력, 수상, 교육 프로그램, 동아리 이력입니다.

links:
  - label: 학생 시절 작품 & 활동 (Notion)
    url: https://app.notion.com/p/3f7bed59c36381ee80b9ebb951ce9502

groups:
