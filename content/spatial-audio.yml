  - name: 방과 문
    height: 7
    layers:
      # 높이 0: 벽, 아래쪽 벽에 문(2칸)
      - map: |
          ....................
          ....................
          ...#########........
          ...#.......#........
          ...#.......#........
          ...#.......#........
          ...#.......#........
          ...#.......#........
          ...#.......#........
          ...###..####........
          ....................
          ....................
      # 높이 1: 귀 높이. 음원은 방 안, 청취자는 방 밖
      - map: |
          ....................
          ....................
          ...#########........
          ...#.......#........
          ...#.......#........
          ...#...S...#........
          ...#.......#........
          ...#.......#....L...
          ...#.......#........
          ...###..####........
          ....................
          ....................
      # 높이 2: 문 위까지 벽
      - map: |
          ....................
          ....................
          ...#########........
          ...#.......#........
          ...#.......#........
          ...#.......#........
          ...#.......#........
          ...#.......#........
          ...#.......#........
          ...#########........
          ....................
          ....................
      # 높이 3: 지붕
      - map: |
          ....................
          ....................
          ...#########........
          ...#########........
          ...#########........
          ...#########........
          ...#########........
          ...#########........
          ...#########........
          ...#########........
          ....................
          ....................

  # 옆으로는 돌아갈 수 없는 벽. 2D 에서는 경로가 없지만 3D 에서는 위로 넘어갑니다.
  - name: 낮은 벽
    height: 7
    layers:
      # 높이 0: 끝까지 이어진 벽
      - map: |
          ..........#.........
          ..........#.........
          ..........#.........
          ..........#.........
          ..........#.........
          ..........#.........
          ..........#.........
          ..........#.........
          ..........#.........
          ..........#.........
          ..........#.........
          ..........#.........
