# 공간음향 차폐 데모 (3D 복셀)
#
# presets 하나가 데모 위쪽 배치 버튼 하나입니다.
# layers 는 바닥부터 한 칸 높이씩 위로 쌓는 배치도입니다. 첫 map 이 바닥 칸, 다음 map 이 그 위 칸입니다.
# 배치도는 위에서 내려다본 모습이고 한 글자가 한 칸(1m)입니다.
#   .  빈 칸      #  블록      L  청취자      S  음원
#   repeat: 3   같은 배치를 세 칸 높이로 쌓습니다. (L / S 는 그 묶음의 맨 아래 칸에 놓입니다)
#   height      전체 높이(칸). 적은 layers 위는 빈 칸입니다. 비우면 layers 수 + 2
# 줄마다 글자 수를 같게 맞춰 주세요. (지금은 가로 20칸, 세로 12칸)
# WebGL2 를 쓸 수 없는 브라우저에서는 청취자 높이에서 자른 2D 단면으로 같은 계산을 보여 줍니다.
#
# realtime 과 optimizations 는 계산 단계(steps) 아래 '실제 게임에서는' 묶음으로 나옵니다.

title: 공간음향 차폐 데모
lead: >-
  Like Or Die 의 차폐도 계산 흐름을 3D 복셀 그리드로 옮겼습니다.
  화면을 끌어 시점을 돌려 보고, 음원과 청취자를 옮기거나 블록을 놓고 지워 보세요.
  소리 듣기를 켜면 계산한 차폐가 실제 소리로 들립니다.

steps:
  - title: 직선 레이
    text: >-
      청취자와 음원 사이를 직선으로 검사합니다. 막히지 않으면 차폐는 0 입니다.
  - title: A\* 우회 경로
    text: >-
      막혔을 때만 복셀 그리드에서 A\* 로 돌아가는 길을 찾습니다.
      위아래를 포함한 26방향으로 움직이고 누적 비용이 포화 임계에 닿으면 더 찾지 않고 멈춥니다.
  - title: 우회 비율
    text: >-
      (경로 길이 − 직선 거리) / 직선 거리. 문 하나를 돌아가거나 낮은 벽을 넘어가면 작고 미로처럼 돌아가면 커집니다.
  - title: 지수 포화 곡선
    text: >-
      차폐 계수는 우회 비율의 지수 포화 곡선입니다. 비율이 커질수록 1에 수렴하되 선형으로 튀지 않고
      가까운 음원은 근접 보정으로 차폐를 약하게 적용합니다.

realtime:
  title: 와이즈에서 제공되는 공간음향을 사용하지 않는 이유
  text: |-
    **실시간 계산**이 필요하고 **레벨 수정이 잦다**는 사운드팀의 요구사항이 있었습니다. 와이즈 공간음향은 공간 정보를 레벨에 미리 배치해 두고 쓰는 방식이라 레벨이 바뀔 때마다 그 배치도 다시 맞춰야 했습니다.

    그래서 차폐를 **직접 실시간으로 계산**하기로 했고 그만큼 늘어나는 부하는 다섯 가지 방법으로 줄였습니다.

optimizations:
  title: 실시간 계산 부하를 줄인 방법
  items:
    - title: 정적 오브젝트 AABB 캐싱
      text: 레벨의 StaticObject 는 AABB 로 뽑아 캐싱해 두고 다시 계산하지 않습니다.
    - title: 동적 오브젝트도 추가될 때 캐싱
      text: 블록처럼 새로 생기는 DynamicObject 도 추가되는 순간 AABB 로 캐싱해 계산을 줄입니다.
    - title: 멀티스레드 (Unreal Tasks)
      text: 탐색은 Unreal Tasks 로 워커 스레드에서 돌려 게임 스레드 부하를 최소화합니다.
    - title: 프레임이 떨어지면 자동 Off
      text: 게임 스레드 프레임이 일정 수준 아래로 떨어지면 계산을 자동으로 끕니다.
    - title: 비동기 레이 트레이스
      text: 레이 검사를 비동기로 돌려 히치를 줄였습니다.

note: >-
  실제 구현은 UE5 C++ 월드 서브시스템이고 계산한 값은 Wwise RTPC 로 넘깁니다.
  밀폐도는 실제처럼 머리 위치에서 26방향 3D 레이를 쏴서 구합니다.
  곡선 기울기, 포화 임계, 근접 보정 거리 같은 숫자는 데모를 움직이려고 정한 값이며 실제 프로젝트 값이 아닙니다.
  데모 소리는 Web Audio 로 합성한 것이고 수치를 볼륨 / 로우패스 / 리버브로 옮기는 값도 데모용입니다.

presets:
