          ..........#.........
          ..........#.........
          ..........#.........
          ..........#.........
          ..........#.........
          ..........#.........
          ..........#.........
          ..........#.........
          ..........#.........

  # 위층 음원. 소리는 계단 구멍을 거쳐 내려옵니다.
